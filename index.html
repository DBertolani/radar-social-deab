</head>
<body>
  <main>
    <h1>Cartão Digital Inteligente | DEAB Digital</h1>
    <p>Carregando sua página…</p>
  </main>
  <script>
    (function () {
      if (window.location.hostname === "bio.deab.com.br") {
        fetch("/bio-home.html", { cache: "no-cache" })
          .then(function (response) {
            if (!response.ok) throw new Error("Não foi possível carregar a página inicial.");
            return response.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            document.querySelector("main").innerHTML =
              "<h1>DEAB Digital</h1><p>Não foi possível carregar a página agora. Atualize em instantes.</p>";
          });
        return;
      }
      window.location.replace("./radar.html" + window.location.search + window.location.hash);
    })();
  </script>
</body>
</html>
