<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%238b5cf6%22/%3E%3Ctext x=%2250%25%22 y=%2270%25%22 font-size=%2265%22 text-anchor=%22middle%22 fill=%22white%22%3ED%3C/text%3E%3C/svg%3E"><meta name="description" content="Cartão digital e canais de contato."><title>Cartão Digital</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#0c111b;--card:#151e2c;--line:#2d3a4e;--text:#f4f6fb;--muted:#aab6c9;--accent:#8b7cff;--glow:#25234a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,var(--glow),transparent 36rem),var(--bg);color:var(--text);padding:28px 14px}main{width:min(460px,100%);margin:auto}.card{border:1px solid var(--line);border-radius:25px;background:var(--card);padding:28px 22px;box-shadow:0 22px 70px #0005;text-align:center}.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:#273248;margin:0 auto 16px}.initials{display:grid;place-items:center;font-size:2rem;font-weight:900}h1{font-size:1.65rem;margin:5px 0 9px;overflow-wrap:anywhere}.tagline{color:var(--muted);white-space:pre-wrap;line-height:1.6;margin:0 auto 22px}.links{display:grid;gap:10px}.link{display:flex;justify-content:center;gap:10px;min-height:51px;padding:12px;border:1px solid var(--accent);border-radius:13px;background:#8b7cff20;color:var(--text);text-decoration:none;font-weight:800;overflow-wrap:anywhere}.libras{margin-top:19px;padding-top:17px;border-top:1px solid var(--line);text-align:left}.libras iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.libras a{color:#d4ceff;font-weight:750}footer{text-align:center;color:#8390a5;font-size:.76rem;padding:20px}footer a{color:#b9b0ff;text-decoration:none}.state{color:var(--muted);text-align:center;padding:35px 15px}
</style></head><body><main><article class="card" id="card"><div class="state" id="state">Carregando cartão digital…</div></article><footer id="footer" hidden>Cartão digital por <a href="https://bio.deab.com.br/">DEAB</a></footer></main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://bvavzgmsiflydrlgeiqf.supabase.co",SUPABASE_KEY="sb_publishable_IgTCeiytetM678AtADKUtQ_n3SL6akf";
const slug=(new URLSearchParams(location.search).get("u")||decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"")).trim().toLowerCase();
const initials=s=>String(s||"?").trim().split(/\s+/).slice(0,2).map(x=>Array.from(x)[0]||"").join("").toUpperCase()||"?";
const safeUrl=s=>{try{const u=new URL(s);return ["https:","http:"].includes(u.protocol)?u.href:null}catch{return null}};
const icons={whatsapp:"💬",instagram:"◎",maps:"📍",website:"🌐",catalog:"▤",phone:"☎",email:"✉",link:"↗"};
async function run(){
 if(!/^[a-z0-9][a-z0-9-]{0,48}[a-z0-9]$|^[a-z0-9]{2,50}$/.test(slug))throw Error("Endereço do cartão inválido.");
 const rows=window.__BIO_DATA__?[window.__BIO_DATA__]:await (async()=>{const response=await fetch(SUPABASE_URL+"/rest/v1/bio_pages?select=slug,username,display_name,tagline,avatar_url,theme_preset,accent_color,buttons,libras_video_url,active&slug=eq."+encodeURIComponent(slug)+"&active=eq.true&limit=1",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Accept-Profile":"social_analytics"}});const result=await response.json().catch(()=>[]);if(!response.ok)throw Error(result.message||"Falha ao consultar o cartão.");return result;})();if(!rows.length)throw Error("Cartão não encontrado ou inativo.");
 const d=rows[0],accent=/^#[0-9a-f]{6}$/i.test(d.accent_color||"")?d.accent_color:"#8b7cff";const themes={essencial:["#0c111b","#151e2c","#25234a"],oceano:["#081521","#102a3b","#123047"],floresta:["#091711","#13271f","#12372f"],sunset:["#1b100d","#2a1b17","#42251f"],rose:["#1b0d18","#2a1727","#402039"],minimal:["#111827","#202b3b","#263244"]};const theme=themes[d.theme_preset]||themes.essencial;document.documentElement.style.setProperty("--bg",theme[0]);document.documentElement.style.setProperty("--card",theme[1]);document.documentElement.style.setProperty("--glow",theme[2]);document.documentElement.style.setProperty("--accent",accent);document.title=(d.display_name||d.username)+" | DEAB";
 const card=document.getElementById("card");card.replaceChildren();
 const avatar=document.createElement(d.avatar_url&&safeUrl(d.avatar_url)?"img":"div");avatar.className="avatar"+(avatar.tagName==="DIV"?" initials":"");
 if(avatar.tagName==="IMG"){avatar.src=d.avatar_url;avatar.alt="Foto de "+(d.display_name||d.username);avatar.onerror=()=>{const f=document.createElement("div");f.className="avatar initials";f.textContent=initials(d.display_name||d.username);avatar.replaceWith(f)};}else avatar.textContent=initials(d.display_name||d.username);card.append(avatar);
 const h=document.createElement("h1");h.textContent=d.display_name||"@"+d.username;card.append(h);
 if(d.tagline){const p=document.createElement("p");p.className="tagline";p.textContent=d.tagline;card.append(p)}
 const links=document.createElement("div");links.className="links";(Array.isArray(d.buttons)?d.buttons:[]).forEach(b=>{const url=safeUrl(b.url);if(!url||!b.label)return;const a=document.createElement("a");a.className="link";a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=(icons[b.type]||"↗")+" "+b.label;links.append(a)});card.append(links);
 const video=safeUrl(d.libras_video_url||"");if(video){const sec=document.createElement("section");sec.className="libras";const title=document.createElement("h2");title.textContent="🤟 Apresentação em LIBRAS";sec.append(title);if(/youtube\.com\/embed\/|player\.vimeo\.com\/video\//i.test(video)){const frame=document.createElement("iframe");frame.src=video;frame.title="Vídeo em LIBRAS";frame.loading="lazy";frame.allowFullscreen=true;sec.append(frame)}else{const a=document.createElement("a");a.href=video;a.target="_blank";a.rel="noopener noreferrer";a.textContent="▶ Assistir ao vídeo em LIBRAS";sec.append(a)}card.append(sec)}
 document.getElementById("footer").hidden=false;
}
run().catch(e=>{const s=document.getElementById("state");s.textContent=e.message||"Não foi possível carregar o cartão."});
})();
</script></body></html>
